name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The credential scan is only useful against the whole history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: sdks/node
      - run: bun run gate
        working-directory: sdks/node
      - run: bun run build
        working-directory: sdks/node

  node-runtime:
    # The package must work on plain Node, not only on the Bun used to build it.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install
        working-directory: sdks/node
      - run: bun run build
        working-directory: sdks/node
      - name: import the built package
        working-directory: sdks/node
        run: |
          node -e "const { brotu } = require('./dist/index.cjs'); \
            const ai = brotu({ providers: { kling: { apiKey: 'x' } } }); \
            if (ai.models().length === 0) { throw new Error('empty catalog'); } \
            console.log('cjs ok:', ai.models().length, 'models');"
          node --input-type=module -e "import('./dist/index.js').then(m => { \
            const ai = m.brotu({ providers: { qwen: { apiKey: 'x' } } }); \
            console.log('esm ok:', ai.models().length, 'models'); });"
